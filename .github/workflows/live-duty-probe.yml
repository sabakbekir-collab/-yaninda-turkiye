name: Live duty probe
on:
  pull_request:
    paths:
      - .github/workflows/live-duty-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://yaninda-turkiye.sabakbekir.workers.dev
    steps:
      - name: Istanbul clock
        run: |
          echo "TODAY=$(TZ=Europe/Istanbul date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "YESTERDAY=$(TZ=Europe/Istanbul date -d yesterday +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "HOUR=$(TZ=Europe/Istanbul date +%H)" >> "$GITHUB_ENV"
          TZ=Europe/Istanbul date
      - name: Health
        run: curl -sS --max-time 20 "$BASE/api/health?v=$GITHUB_SHA-$GITHUB_RUN_ID" | tee health.json
      - name: Mus debug
        run: |
          curl -sS -G --max-time 40 -o mus-debug.json -w "HTTP %{http_code}\n" "$BASE/api/places" --data-urlencode "category=pharmacy" --data-urlencode "province=Muş" --data-urlencode "radius=5" --data-urlencode "anchor=area" --data-urlencode "debug=1" --data-urlencode "v=$GITHUB_RUN_ID"
          head -c 6000 mus-debug.json
      - name: Ankara debug
        run: |
          curl -sS -G --max-time 40 -o ankara-debug.json -w "HTTP %{http_code}\n" "$BASE/api/places" --data-urlencode "category=pharmacy" --data-urlencode "province=Ankara" --data-urlencode "district=Çankaya" --data-urlencode "radius=5" --data-urlencode "anchor=area" --data-urlencode "debug=1" --data-urlencode "v=$GITHUB_RUN_ID"
          head -c 6000 ankara-debug.json
      - name: Mus normal call
        run: |
          curl -sS -G --max-time 40 -D mus-headers.txt -o mus.json -w "HTTP %{http_code}\n" "$BASE/api/places" --data-urlencode "category=pharmacy" --data-urlencode "province=Muş" --data-urlencode "radius=5" --data-urlencode "anchor=area" --data-urlencode "v=$GITHUB_RUN_ID"
          cat mus-headers.txt
          head -c 3000 mus.json
      - name: Ankara normal call
        run: |
          curl -sS -G --max-time 40 -D ankara-headers.txt -o ankara.json -w "HTTP %{http_code}\n" "$BASE/api/places" --data-urlencode "category=pharmacy" --data-urlencode "province=Ankara" --data-urlencode "district=Çankaya" --data-urlencode "radius=5" --data-urlencode "anchor=area" --data-urlencode "v=$GITHUB_RUN_ID"
          cat ankara-headers.txt
          head -c 3000 ankara.json
      - name: Direct provider GET probes pass 1
        run: |
          probe_fail=0
          probe() {
            name="$1"
            url="$2"
            shift 2
            echo "===== $name ====="
            curl -sS --fail-with-body -G --max-time 30 -D "$name.headers" -o "$name.json" -w "HTTP %{http_code}\n" "$url" -H "Accept: application/json" -H "User-Agent: YanimdaTurkiye/1.0 (+https://yaninda-turkiye.sabakbekir.workers.dev)" "$@"
            rc=$?
            echo "CURL_EXIT=$rc"
            if [ -f "$name.headers" ]; then
              echo "RESPONSE_HEADERS:"
              awk 'BEGIN { IGNORECASE=1 } /^date:|^cache-control:|^age:|^cf-cache-status:|^last-modified:|^etag:/ {print}' "$name.headers"
            fi
            if [ -f "$name.json" ]; then
              echo "BODY_FIRST_3000:"
              head -c 3000 "$name.json"
              echo
              if jq -e . "$name.json" >/dev/null 2>&1; then
                echo "DATE_FIELDS:"
                jq -r '[paths(scalars) as $p | ($p[-1] | tostring) as $k | select($k | test("date|updated|last.?update|tarih|roster"; "i")) | {path: ($p | map(tostring) | join(".")), value: getpath($p)}] | if length > 0 then .[] | "\(.path)=\(.value)" else "NO_MATCHING_DATE_FIELDS" end' "$name.json"
                echo "TOP_LEVEL_KEYS:"
                jq -r 'if type == "object" then keys[] else "root_type=" + type end' "$name.json"
              else
                echo "JSON_PARSE_FAILED"
              fi
            else
              echo "BODY_FILE_MISSING"
            fi
            if [ "$rc" -ne 0 ]; then probe_fail=1; fi
          }
          probe eczane-mus-pass1 https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=mus" --data-urlencode "limit=200"
          probe eczane-ankara-district-pass1 https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=ankara" --data-urlencode "district=cankaya" --data-urlencode "limit=200"
          probe eczane-ankara-province-fallback-pass1 https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=ankara" --data-urlencode "limit=200"
          probe turkpidya-mus-pass1 https://turkpidya.com/wp-json/turkpidya-data/v1/pharmacies/on-duty --data-urlencode "city=mus"
          probe turkpidya-ankara-pass1 https://turkpidya.com/wp-json/turkpidya-data/v1/pharmacies/on-duty --data-urlencode "city=ankara"
          exit "$probe_fail"
      - name: Wait 20 seconds
        run: sleep 20
      - name: Direct provider GET probes pass 2 and cache bust
        run: |
          probe_fail=0
          probe() {
            name="$1"
            url="$2"
            shift 2
            echo "===== $name ====="
            curl -sS --fail-with-body -G --max-time 30 -D "$name.headers" -o "$name.json" -w "HTTP %{http_code}\n" "$url" -H "Accept: application/json" -H "User-Agent: YanimdaTurkiye/1.0 (+https://yaninda-turkiye.sabakbekir.workers.dev)" "$@"
            rc=$?
            echo "CURL_EXIT=$rc"
            if [ -f "$name.headers" ]; then
              echo "RESPONSE_HEADERS:"
              awk 'BEGIN { IGNORECASE=1 } /^date:|^cache-control:|^age:|^cf-cache-status:|^last-modified:|^etag:/ {print}' "$name.headers"
            fi
            if [ -f "$name.json" ]; then
              echo "BODY_FIRST_3000:"
              head -c 3000 "$name.json"
              echo
              if jq -e . "$name.json" >/dev/null 2>&1; then
                echo "DATE_FIELDS:"
                jq -r '[paths(scalars) as $p | ($p[-1] | tostring) as $k | select($k | test("date|updated|last.?update|tarih|roster"; "i")) | {path: ($p | map(tostring) | join(".")), value: getpath($p)}] | if length > 0 then .[] | "\(.path)=\(.value)" else "NO_MATCHING_DATE_FIELDS" end' "$name.json"
                echo "TOP_LEVEL_KEYS:"
                jq -r 'if type == "object" then keys[] else "root_type=" + type end' "$name.json"
              else
                echo "JSON_PARSE_FAILED"
              fi
            else
              echo "BODY_FILE_MISSING"
            fi
            if [ "$rc" -ne 0 ]; then probe_fail=1; fi
          }
          probe eczane-mus-pass2 https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=mus" --data-urlencode "limit=200"
          probe eczane-ankara-district-pass2 https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=ankara" --data-urlencode "district=cankaya" --data-urlencode "limit=200"
          probe eczane-ankara-province-fallback-pass2 https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=ankara" --data-urlencode "limit=200"
          probe turkpidya-mus-pass2 https://turkpidya.com/wp-json/turkpidya-data/v1/pharmacies/on-duty --data-urlencode "city=mus"
          probe turkpidya-ankara-pass2 https://turkpidya.com/wp-json/turkpidya-data/v1/pharmacies/on-duty --data-urlencode "city=ankara"
          probe eczane-mus-cache-bust https://eczaneadresi.com/api/public/v1/duty-pharmacies --data-urlencode "city=mus" --data-urlencode "limit=200" --data-urlencode "v=$GITHUB_RUN_ID"
          exit "$probe_fail"
      - name: Upload direct provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-provider-probe
          path: |
            eczane-*.json
            eczane-*.headers
            turkpidya-*.json
            turkpidya-*.headers
      - name: Assert no stale duty rows
        run: |
          set -u
          fail=0
          for f in mus.json ankara.json; do
            dates=$(jq -r '(if type=="array" then . else (.places // []) end) | [.[] | select(.verifiedAt != null) | (.verifiedAt|tostring)[0:10]] | unique | .[]' "$f" 2>/dev/null || true)
            count=$(jq -r '(if type=="array" then . else (.places // []) end) | length' "$f" 2>/dev/null || echo "n/a")
            echo "$f rows=$count dates=[$dates]"
            for d in $dates; do
              if [ "$d" != "$TODAY" ]; then
                if [ "$d" = "$YESTERDAY" ] && [ "$HOUR" -lt 9 ]; then continue; fi
                echo "STALE DATE $d in $f"
                fail=1
              fi
            done
          done
          exit $fail
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-duty-probe
          path: |
            health.json
            mus-debug.json
            ankara-debug.json
            mus.json
            ankara.json
            mus-headers.txt
            ankara-headers.txt
