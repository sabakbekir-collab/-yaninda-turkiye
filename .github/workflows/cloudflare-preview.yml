name: Deploy PR preview to Cloudflare

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'yaninda-turkiye-fixed*.zip'

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy isolated preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: TypeScript typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Apply migrations to preview D1 only
        run: npx wrangler d1 migrations apply DB --remote --config ./wrangler.preview.jsonc
      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config ./wrangler.preview.jsonc --var COMMIT_SHA:${{ github.sha }}
