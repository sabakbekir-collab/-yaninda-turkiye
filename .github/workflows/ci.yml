name: CI

on:
  push:
    branches: [main, fix/security-health-admin-ai, feat/telegram-admin-bot]
    paths-ignore:
      - 'yaninda-turkiye-fixed*.zip'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations to local test database
        run: npx --yes wrangler@4 d1 migrations apply DB --local --config ./wrangler.jsonc
      - run: npm test
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
