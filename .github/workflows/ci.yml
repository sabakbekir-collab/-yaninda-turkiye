name: CI

on:
  push:
    branches: [main, fix/security-health-admin-ai]
    paths-ignore:
      - 'yaninda-turkiye-fixed*.zip'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
