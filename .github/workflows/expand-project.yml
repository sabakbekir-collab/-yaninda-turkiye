name: Expand Yaninda Turkiye project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check archive
        shell: bash
        run: |
          set -euo pipefail
          test -s yaninda-turkiye-fixed.zip
          unzip -tq yaninda-turkiye-fixed.zip

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .yaninda_extract
          mkdir .yaninda_extract
          unzip -q yaninda-turkiye-fixed.zip -d .yaninda_extract
          shopt -s dotglob nullglob
          entries=(.yaninda_extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. .
          else
            cp -a .yaninda_extract/. .
          fi
          rm -rf .yaninda_extract yaninda-turkiye-fixed.zip

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: expand Yanında Türkiye project" || exit 0
          git push origin HEAD:main
