name: Expand Yaninda Turkiye project

on:
  push:
    branches: [main]
    paths:
      - 'yaninda-turkiye-fixed*.zip'
      - '.github/workflows/expand-project.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaninda-project-expansion
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find and check archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(yaninda-turkiye-fixed*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one yaninda-turkiye-fixed*.zip archive; found ${#archives[@]}."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          printf '%s\n' "${archives[0]}" > .yaninda_archive_name
          test -s "${archives[0]}"
          unzip -tq "${archives[0]}"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat .yaninda_archive_name)"
          rm -rf .yaninda_extract
          mkdir .yaninda_extract
          unzip -q "$archive" -d .yaninda_extract
          shopt -s dotglob nullglob
          entries=(.yaninda_extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. .
          else
            cp -a .yaninda_extract/. .
          fi
          rm -rf .yaninda_extract "$archive" .yaninda_archive_name

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Keep workflow files controlled by the repository, not by the uploaded archive.
          git restore --source=HEAD --staged --worktree .github/workflows
          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "chore: expand Yanında Türkiye project"
            git push origin HEAD:main
          fi

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ./wrangler.jsonc
