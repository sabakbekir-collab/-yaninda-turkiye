name: Expand Yaninda Turkiye project

on:
  push:
    branches: [main]
    paths:
      - 'yaninda-turkiye-fixed.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaninda-project-expansion
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check archive
        shell: bash
        run: |
          set -euo pipefail
          test -s yaninda-turkiye-fixed.zip
          unzip -tq yaninda-turkiye-fixed.zip

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .yaninda_extract
          mkdir .yaninda_extract
          unzip -q yaninda-turkiye-fixed.zip -d .yaninda_extract
          shopt -s dotglob nullglob
          entries=(.yaninda_extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. .
          else
            cp -a .yaninda_extract/. .
          fi
          rm -rf .yaninda_extract yaninda-turkiye-fixed.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "chore: expand Yanında Türkiye project"
            git push origin HEAD:main
          fi

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ./wrangler.jsonc
