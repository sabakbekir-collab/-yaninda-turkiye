name: Expand project archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ hashFiles('package.json', 'frontend/package.json', 'src/package.json') == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          set -e
          test -f yaninda-turkiye-fixed.zip
          mkdir -p .yaninda_extract
          unzip -q yaninda-turkiye-fixed.zip -d .yaninda_extract
          shopt -s dotglob nullglob
          entries=(.yaninda_extract/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. .
          else
            cp -a .yaninda_extract/. .
          fi
          rm -rf .yaninda_extract
          rm -f yaninda-turkiye-fixed.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: expand project archive" || exit 0
          git push
